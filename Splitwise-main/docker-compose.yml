services:
  backend:
    build:
      context: ./SW_backend
    environment:
      PORT: 4000
      DB_PATH: /data/sw.db
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-production}
      CORS_ORIGIN: http://localhost:8088
    volumes:
      - sw_data:/data
    ports:
      - "4001:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./SW_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  sw_data:
